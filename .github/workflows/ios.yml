name: Build iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Archive (Unsigned)
        run: |
          xcodebuild -project DynamicECG.xcodeproj \
            -scheme DynamicECG \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DynamicECG.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/DynamicECG.xcarchive/Products/Applications/DynamicECG.app Payload/
          zip -r DynamicECG_unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicECG_unsigned_ipa
          path: DynamicECG_unsigned.ipa
          retention-days: 14
